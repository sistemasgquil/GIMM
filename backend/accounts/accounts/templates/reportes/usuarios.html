{% extends 'base.html' %}
{% load static %}

{% block title %}Reporte de usuarios | GIMM{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/reportes_usuarios.css' %}">
{% endblock %}

{% block content %}

<div class="reporte-usuarios">

    <div class="reporte-encabezado">
        <div>
            <h2>Reporte de usuarios</h2>
            <p class="reporte-descripcion">
                Consulta y resumen de los usuarios registrados en GIMM.
            </p>
        </div>

        <button
            type="button"
            class="boton-imprimir"
            onclick="window.print()">
            Imprimir reporte
        </button>
    </div>

    <div class="tarjeta-resumen">
        <h3>Total de usuarios</h3>
        <p>{{ total_usuarios }}</p>
    </div>

</div>

{% endblock %}
