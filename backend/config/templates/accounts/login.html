<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GIMM - Iniciar sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 350px;
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;

            margin-bottom: 15px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 11px;

            background: #333;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>GIMM</h1>

        <div class="subtitulo">
            Sistema de Gestión de Gimnasio
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Usuario
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </div>

</body>

</html>
