{% extends 'base.html' %}

{% block title %}
Editar tipo de artículo - GIMM
{% endblock %}

{% block content %}

<h2>Editar tipo de artículo</h2>

<p>
    Modifique la información del tipo de artículo.
</p>

<form method="POST">

    {% csrf_token %}

    <div style="margin-bottom: 15px;">

        <label>
            <strong>Nombre</strong>
        </label>

        <br>

        <input
            type="text"
            name="nombre"
            maxlength="100"
            value="{{ tipo.nombre }}"
            required
            style="
                width: 100%;
                max-width: 500px;
                padding: 10px;
                margin-top: 5px;
            "
        >

    </div>


    <div style="margin-bottom: 20px;">

        <label>
            <strong>Descripción</strong>
        </label>

        <br>

        <textarea
            name="descripcion"
            rows="4"
            style="
                width: 100%;
                max-width: 500px;
                padding: 10px;
                margin-top: 5px;
            "
        >{{ tipo.descripcion }}</textarea>

    </div>


    <button
        type="submit"
        style="
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        "
    >
        Guardar cambios
    </button>


    <a
        href="{% url 'lista_tipos_articulo' %}"
        style="
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-left: 8px;
        "
    >
        Cancelar
    </a>

</form>

{% endblock %}
