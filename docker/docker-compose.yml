services:
  postgres:
    image: postgres:17
    container_name: gimm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gimm
      POSTGRES_USER: gimm_user
      POSTGRES_PASSWORD: gimm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
